allowBuilds:
  esbuild: true
  sharp: false
  workerd: false

minimumReleaseAgeExclude:
  - "@tanstack/*"
  - vite-plugin-solid
  - solid-js
  - "@solidjs/*"
  - babel-preset-solid
  - "@dom-expressions/*"
  # registry metadata for these lacks the "time" field the release-age gate needs
  - "seroval"
  - "seroval-plugins"
  - "undici-types"
